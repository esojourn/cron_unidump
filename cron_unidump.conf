#--------------------------------------------------------#
# cron_unidump global config  ->  copied to ~/.cron_unidump.conf
# Per-job settings live in ~/.cron_unidump.d/<name>.conf
# Keep this file private: chmod 600 ~/.cron_unidump.conf
#--------------------------------------------------------#

# ---------- Output ----------
# Where archives are written (one sub directory per job). Also what gets pushed.
fileDir=/var/www/html/backup
dbDir=/var/www/html/backup
# Snapshots and logs (one sub directory per job)
#logDir=/var/log/backup
# Owner of the finished archives
BACKUP_FILEOWN='root:root'

# ---------- File backup ----------
# Full backup every N days; in between only changes are archived
BACKUP_INTERVAL_DAYS=14
# incremental: changes since the previous run (small, restore needs the whole chain)
# differential: changes since the last full backup (bigger, restore needs full + last diff)
BACKUP_FILE_MODE=incremental

# ---------- MySQL defaults (a job can override with DBHOST/DBUSER/DBPASS) ----------
BACKUP_HOST="localhost"
BACKUP_USER="backup"
BACKUP_PASS="CHANGE_ME"

# ---------- Mail (not implemented yet, keep n) ----------
BACKUP_MAIL=n

# ---------- Push to NAS (cron_unidump push / run) ----------
# Required for push:
PUSH_HOST=''                    # NAS host name or IP, e.g. nas.example.com
PUSH_USER=''                    # SSH user on the NAS
PUSH_PATH=''                    # base directory on the NAS, e.g. /volume1/backup
PUSH_SERVER=''                  # sub directory for this server, e.g. 001-web1
# Optional:
#PUSH_PORT='22'
#PUSH_SRC='/var/www/html/backup'                 # local directory to push (= fileDir/dbDir)
#PUSH_SSH_KEY="$HOME/.ssh/id_rsa"
#PUSH_KNOWN_HOSTS="$HOME/.ssh/known_hosts_nas"   # NAS host key only, see README
#PUSH_LOG='/var/log/backup/rsyncPush.log'
#PUSH_WAIT_MAX=21600                             # seconds to wait for a running backup
#PUSH_BWLIMIT=''                                 # KiB/s, empty = unlimited
