#--------------------------------------------------------#
# Default Settings
#--------------------------------------------------------#
# Files
# ----------
BACKUP_USERGROUP='nginx:nginx'
BACKUP_FILEOWN='vagrant:vagrant'
# Mysql
# ----------
BACKUP_HOST="localhost"
BACKUP_USER="root"
BACKUP_PASS="YOUR_PASSWORD_HERE"
# Mail
# ----------
# set to 'y' if you'd like to be emailed the backup (requires mutt)
BACKUP_MAIL=y
# email addresses to send backups to, separated by a space
BACKUP_EMAILS="yanjun.liu@unicom-china.com"
BACKUP_SUBJECT="MySQL backup on $SERVER ($DATE)"
# Delete
# ----------
# delete old files?
BACKUP_DELETE=y
# File backup: make a full backup every N days
BACKUP_INTERVAL_DAYS=30
# File backup mode between full backups: incremental | differential
BACKUP_FILE_MODE=incremental
# Backup output directories (also the source pushed to the NAS)
#fileDir=/var/www/html/backup
#dbDir=/var/www/html/backup
# Push to NAS (cron_unidump push / run)
# ----------
# NAS sub directory for this server, e.g. 001-SK2024 (required for push)
PUSH_SERVER=''
#PUSH_SRC='/var/www/html/backup'
#PUSH_HOST='dingxuan.synology.me'
#PUSH_USER='unicom'
#PUSH_PORT='11756'
#PUSH_PATH='/var/services/homes/unicom/rsync'
#PUSH_SSH_KEY="$HOME/.ssh/id_rsa"
# known_hosts with the NAS host key only (strict checking):
#   ssh-keyscan -p 11756 dingxuan.synology.me > ~/.ssh/known_hosts_nas
#PUSH_KNOWN_HOSTS="$HOME/.ssh/known_hosts_nas"
#PUSH_LOG='/var/log/backup/rsyncPush.log'
#PUSH_WAIT_MAX=21600
#PUSH_BWLIMIT=''
